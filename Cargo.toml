[package]
name = "ts-launcher"
version = "0.11.0"
edition = "2024"
description = "Installer and launcher for The Specialists 3.0 (Half-Life or Xash3D FWGS)"
repository = "https://github.com/the-specialists-mod/tsmod-launcher"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
bzip2 = "0.6.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
dunce = "1.0.5"
env_logger = "0.11.11"
flate2 = "1.1.10"
gpui-kit = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4.34"
md-5 = "0.11.0"
sha2 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sevenz-rust2 = "0.24.0"
tar = "0.4.46"
ureq = { version = "3.4.2", features = ["json"] }
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

# The Steam client's server list. See build.rs and .cargo/config.toml for how it is linked.
[target.'cfg(all(target_arch = "x86_64", any(target_os = "linux", target_os = "windows")))'.dependencies]
libloading = "0.8"
steamworks = { version = "0.13.1", features = ["raw-bindings"] }

[build-dependencies]
winresource = "0.1.34"

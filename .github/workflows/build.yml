name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ts-launcher-linux-x86_64
            binary: target/release/ts-launcher
          - os: windows-latest
            artifact: ts-launcher-windows-x86_64
            binary: target/release/ts-launcher.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev libzstd-dev libasound2-dev libssl-dev
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $find = {
            (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
            Get-Item "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue |
              ForEach-Object FullName
          }
          $iscc = & $find | Where-Object { $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = & $find | Where-Object { $_ } | Select-Object -First 1 }
          if (-not $iscc) { throw "ISCC.exe not found" }
          Write-Host "using $iscc"
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$version" "/DExe=$PWD\target\release\ts-launcher.exe" /DOutputName=ts-launcher-setup installer\ts-launcher.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ts-launcher-windows-x86_64-setup
          path: target/installer/ts-launcher-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - run: |
          mv ts-launcher-linux-x86_64/ts-launcher ts-launcher-${{ github.ref_name }}-linux-x86_64.bin
          mv ts-launcher-windows-x86_64/ts-launcher.exe ts-launcher-${{ github.ref_name }}-windows-x86_64.exe
          mv ts-launcher-windows-x86_64-setup/ts-launcher-setup.exe ts-launcher-${{ github.ref_name }}-windows-x86_64-setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ts-launcher-${{ github.ref_name }}-linux-x86_64.bin
            ts-launcher-${{ github.ref_name }}-windows-x86_64.exe
            ts-launcher-${{ github.ref_name }}-windows-x86_64-setup.exe
